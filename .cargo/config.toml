[env]
# Mesa/WebKitGTK may initialize before Rust enters `main`, so these must be in
# the environment of the process spawned by `cargo run`, not set by the app.
LIBGL_ALWAYS_SOFTWARE = { value = "1", force = false }
WEBKIT_DISABLE_COMPOSITING_MODE = { value = "1", force = false }

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN/../lib/WEFT/lib"]
