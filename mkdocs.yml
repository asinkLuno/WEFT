site_name: Weft
site_description: WEFT — World-building, Era, and Fantasy Timeline
theme:
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite

nav:
  - 概述: index.md
  - DAO 字段设计: dao.md
  - AI 与 MCP: mcp.md
  - YAML 规范: weft-yaml.md
  - Moai 实体: moai.md
  - Drift 事件: drift.md
  - 时间引擎: phase.md
  - 桌面应用通信: api.md
