default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: ruff format --check
        language: system
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        files: ^(weft_backend/|tests/backend/|pyproject\.toml$|uv\.lock$)
        pass_filenames: false

      - id: gen-types
        name: gen-types (OpenAPI → TS)
        entry: bash weft-frontend/scripts/check-types.sh
        language: system
        files: ^weft_backend/.*\.py$
        pass_filenames: false

      - id: next-lint
        name: next-lint
        entry: bash -c 'cd weft-frontend && npm run lint'
        language: system
        types_or: [javascript, ts, tsx, jsx]
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: bash -c 'cd weft-frontend && npm run format'
        language: system
        types_or: [javascript, ts, tsx, jsx, json, css]
        pass_filenames: false

      - id: next-build
        name: next-build
        entry: bash -c 'cd weft-frontend && npm run build'
        language: system
        types_or: [javascript, ts, tsx, jsx]
        pass_filenames: false

      - id: backend-coverage
        name: backend coverage (minimum 59%)
        entry: uv run pytest --cov=weft_backend --cov-report=term-missing --cov-report=xml:coverage/backend.xml --cov-fail-under=59
        language: system
        files: ^(weft_backend/|tests/backend/|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-coverage
        name: frontend Vitest coverage
        entry: yarn --cwd weft-frontend test:coverage
        language: system
        files: ^weft-frontend/
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-e2e
        name: frontend Playwright
        entry: yarn --cwd weft-frontend test:e2e
        language: system
        files: ^weft-frontend/
        pass_filenames: false
        stages: [pre-push]
