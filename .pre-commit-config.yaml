repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: ruff format --check
        language: system
        types: [python]

      - id: pytest
        name: pytest
        entry: pytest
        language: system
        files: ^(weft_backend/|tests/backend/|pyproject\.toml$|uv\.lock$)
        pass_filenames: false

      - id: gen-types
        name: gen-types (OpenAPI → TS)
        entry: bash weft-frontend/scripts/check-types.sh
        language: system
        files: ^weft_backend/.*\.py$
        pass_filenames: false

      - id: next-lint
        name: next-lint
        entry: bash -c 'cd weft-frontend && npm run lint'
        language: system
        types_or: [javascript, ts, tsx, jsx]
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: bash -c 'cd weft-frontend && npm run format'
        language: system
        types_or: [javascript, ts, tsx, jsx, json, css]
        pass_filenames: false

      - id: next-build
        name: next-build
        entry: bash -c 'cd weft-frontend && npm run build'
        language: system
        types_or: [javascript, ts, tsx, jsx]
        pass_filenames: false
