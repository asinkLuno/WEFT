repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: ruff format --check
        language: system
        types: [python]

      - id: next-lint
        name: next-lint
        entry: bash -c 'cd weft-frontend && npm run lint'
        language: system
        types_or: [javascript, ts, tsx, jsx]
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: bash -c 'cd weft-frontend && npm run format'
        language: system
        types_or: [javascript, ts, tsx, jsx, json, css]
        pass_filenames: false
