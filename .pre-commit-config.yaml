default_install_hook_types: [pre-commit, pre-push]

repos:
  # These hooks are built into prek and run entirely in Rust without cloning
  # pre-commit-hooks or creating a Python environment.
  - repo: builtin
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: rust-test
        name: Rust backend tests
        entry: cargo test --manifest-path src-tauri/Cargo.toml
        language: system
        files: ^src-tauri/
        pass_filenames: false

      - id: rust-fmt
        name: Rust formatting
        entry: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
        language: system
        files: ^src-tauri/.*\.rs$
        pass_filenames: false

      - id: frontend-lint
        name: frontend-lint
        entry: yarn lint
        language: system
        types_or: [javascript, ts, tsx, jsx]
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: yarn format
        language: system
        types_or: [javascript, ts, tsx, jsx, json, css]
        pass_filenames: false

      - id: frontend-build
        name: frontend-build
        entry: yarn build
        language: system
        types_or: [javascript, ts, tsx, jsx]
        pass_filenames: false

      - id: frontend-coverage
        name: frontend Vitest coverage
        entry: yarn test:coverage
        language: system
        files: ^(app|components|lib|public|src|tests)/
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-e2e
        name: frontend Playwright
        entry: yarn test:e2e
        language: system
        files: ^(app|components|lib|public|src|tests)/
        pass_filenames: false
        stages: [pre-push]
