[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "weft-backend"
version = "0.0.2"
description = "WEFT (World-building, Era, and Fantasy Timeline) backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.10.0",
    "loguru>=0.7.3",
    "watchfiles>=1.2.0",
    "pytauri==0.8.*",
    "anyio==4.*",
    "mcp>=1.2,<2",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[dependency-groups]
dev = [
    "mkdocs-terminal>=4.8.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=5.0.0",
    "radon>=6.0.1",
    "ruff>=0.15.20",
    "ty>=0.0.55",
    "vulture>=2.16",
]

[tool.setuptools.packages.find]
include = ["weft_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
addopts = "--strict-markers --strict-config"
markers = [
    "unit: 纯 Python 领域逻辑，无 I/O",
    "integration: 组合多个模块或触碰文件系统",
    "e2e: 通过 MCP 公共 API 走完完整加载链路",
]

[tool.ruff]
lint.select = ["I", "F", "E4", "E7", "E9", "UP", "B", "SIM"]
lint.fixable = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["weft_backend"]
