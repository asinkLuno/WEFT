[project]
name = "weft-backend"
version = "0.1.0"
description = "WEFT (World-building, Era, and Fantasy Timeline) backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.138.1",
    "pyyaml>=6.0.3",
    "pydantic>=2.10.0",
    "loguru>=0.7.3",
    "click>=8.4.2",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "radon>=6.0.1",
    "ruff>=0.15.20",
    "ty>=0.0.55",
    "vulture>=2.16",
]
