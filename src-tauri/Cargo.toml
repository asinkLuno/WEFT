[package]
name = "weft"
version = "0.1.1"
description = "WEFT — World-building, Era, and Fantasy Timeline"
edition = "2021"

[lib]
name = "weft_lib"
crate-type = ["rlib"]

[[bin]]
name = "weft"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
rhai = { version = "1.21", features = ["sync", "serde"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
