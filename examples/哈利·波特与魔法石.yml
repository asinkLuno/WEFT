story:
  title: 哈利·波特与魔法石
  description: >-
    以第一部小说的结构化事件摘要展示内置格里高利历、人物生日时间锚点、
    星座 material、实体关系、学年时间线与哈利的限知视角；不收录原著正文或对白。
  date_mode: gregorian

moai:
  哈利·波特:
    base_time: &harry_birth [1980, 7, 31, 0, 0, 0]
    description: 在姨父母家长大，于十一岁生日得知自己是巫师并进入霍格沃茨。
    materials: [constellation]
  罗恩·韦斯莱:
    description: 哈利在前往霍格沃茨的列车上结识的同学，后来成为亲密朋友。
  赫敏·格兰杰:
    description: 重视知识与规则的格兰芬多学生，在万圣节事件后与哈利、罗恩成为朋友。
  鲁伯·海格:
    description: 霍格沃茨钥匙保管员，向哈利说明其身世并带他进入魔法世界。
  阿不思·邓布利多:
    description: 霍格沃茨校长，参与保护魔法石并在学年末与哈利谈话。
  米勒娃·麦格:
    description: 霍格沃茨副校长与格兰芬多院长。
  德拉科·马尔福:
    description: 斯莱特林学生，与哈利在学校中形成对立。
  西弗勒斯·斯内普:
    description: 魔药课教师，其行为一度使哈利误判魔法石面临的威胁。
  奎里纳斯·奇洛:
    description: 黑魔法防御术教师，试图取得魔法石。
  伏地魔:
    description: 杀害哈利父母的黑巫师，在失去身体后试图借魔法石恢复力量。
  莉莉·波特:
    description: 哈利的母亲，以牺牲保护了年幼的哈利。
  詹姆·波特:
    description: 哈利的父亲，在伏地魔袭击波特一家时遇害。
  霍格沃茨:
    description: 教授魔法的寄宿学校，第一部主要事件发生地。
  魔法石:
    description: 能炼制长生不老药并将金属变成黄金的炼金造物，被严密保护。
  厄里斯魔镜:
    description: 显示观看者内心最深渴望的魔法物品，也是魔法石最终保护机关的一部分。

