      description: >-
        4月24日，两人在大冰川南行穿越雪桥时埃斯文坠入裂谷。金利·艾压住雪橇并把他拖回冰面，随后两人用绳索和探杖谨慎探路。
    走出虚空冰原:
      start_time: [2, 4, 25]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 戈布宁大冰川, 戈森湾]
      description: >-
        次日两人终于走完裂谷地带，向东行进四天；暴风雪又将他们困在帐篷中三天，食物削减后重新恢复全额配给。
    抵达戈森湾:
      start_time: [2, 5, 5]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 戈布宁大冰川, 戈森湾]
      description: >-
        旅程第75天，两人走下戈布宁大冰川抵达戈森湾冰海，丢弃雪橇并沿海岸向南；食物几近耗尽，靠最后的谷粒、芽苞、吉西米西和糖支撑。
    获救后前往萨斯洛斯:
      start_time: [2, 5, 8]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 库库尔斯特, 萨斯洛斯, 瑟西切尔, 艾河, 卡尔海德]
      description: >-
        两人抵达卡尔海德北方库库尔斯特村，在热食店受到村民欢迎和款待；休整后搭压雪机、步行和机动雪橇南下，
        经村庄投宿抵达萨斯洛斯。瑟西切尔农场主收留他们，埃斯文计划寻找藏身处。
    发射醒来信号:
      start_time: [2, 5, 12, 17]
      moais: [金利·艾, 纳芙尔号, 萨斯洛斯, 艾克曼, 卡尔海德]
      description: >-
        金利·艾在萨斯洛斯贸易学校出售夏帕炉，购买十分钟私人发射时间，向中继卫星发出"醒来"信号，召唤纳芙尔号前来。
    边境哨兵枪杀埃斯文:
      start_time: [2, 5, 13]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 瑟西切尔, 西洛斯峡谷, 艾河, 奥格雷纳, 卡尔海德]
      description: >-
        瑟西切尔的无线电告密暴露埃斯文身份。两人越过冰封艾河接近西洛斯峡谷边境，夜间埃斯文独自冲向奥格雷纳哨兵，被袭击枪击毙；临死只叫出阿瑞克的名字。
    押回萨斯洛斯:
      start_time: [2, 5, 14]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 萨斯洛斯, 卡尔海德]
      description: >-
        边境人员将金利·艾押往萨斯洛斯监禁，把埃斯文遗体带往另一方向；第19章以埃斯文死亡和两人被迫分离结束。

  傻瓜的使命:
    萨斯洛斯养病:
      start_time: [2, 5, 15]
      moais: [金利·艾, 萨斯洛斯, 萨斯洛斯年轻医生, 卡尔海德]
      description: >-
        金利·艾因陪伴被放逐者而被押回萨斯洛斯，住进当选领主塔楼并严重营养不良。年轻医生照料他，发烧梦呓中反复回想埃斯文冲向枪口。
    两国政府更替:
      start_time: [2, 5, 25]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 阿加文十五世, 帕米尔·哈格·列米尔·蒂帕, 萨尔夫, 奥格雷纳总督委员会, 卡尔海德, 奥格雷纳]
      description: >-
        金利·艾卧床十日间，奥格雷纳萨尔夫集团因谎言暴露而失势，自由贸易派接管总督委员会；蒂帕也在瑟西切尔告密和埃斯文死亡消息后辞职。
    返回艾尔亨朗:
      start_time: [2, 6, 1]
      moais: [金利·艾, 萨斯洛斯年轻医生, 艾尔亨朗, 卡尔海德]
      description: >-
        阿加文国王发急电召金利·艾回艾尔亨朗，并汇路费；萨斯洛斯派年轻医生护送他乘机动雪橇穿越积雪道路，入住圆塔楼。
    筹备并获准接待:
      start_time: [2, 6, 2]
      moais: [金利·艾, 法克斯, 圆塔楼, 纳芙尔号, 艾克曼, 卡尔海德, 阿加文十五世]
      description: >-
        金利·艾在圆塔楼与入阁的法克斯会面，确认纳芙尔号即将抵达，并安排无线电导航、着陆地点和接待礼仪；次日觐见国王。
        金利·艾随后向阿加文十五世说明飞船将在阿斯顿·芬着陆，请求撤销埃斯文放逐令。国王暂不答应，
        但命人妥善接待艾克曼使团。
    纳芙尔号登陆:
      start_time: [2, 6, 4, 3]
      moais: [金利·艾, 朗赫幽, 纳芙尔号, 阿斯顿·芬, 法克斯, 卡尔海德, 艾克曼]
      description: >-
        早春五月中旬的暮色中，纳芙尔号在阿斯顿·芬泥炭荒原依无线电信标平稳着陆。朗赫幽率十一名艾克曼人员下船，以卡尔海德语宣布带着友谊而来。
    使命继续:
      start_time: [2, 7, 20]
      moais: [金利·艾, 朗赫幽, 艾克曼, 卡尔海德, 奥格雷纳]
      description: >-
        冰雪融化后，金利·艾在艾尔亨朗大使馆休假并派同胞前往西斯、列岛、奥格雷纳等地开展联盟工作；新联盟不急于求成，星际航行需要多年。
    拜访埃斯特领主:
      start_time: [2, 8, 8]
      moais: [金利·艾, 埃斯特领地, 埃斯万斯·哈尔斯·瑟尔瑞姆·伊尔·埃斯文, 索尔夫·哈尔斯, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 阿瑞克, 戈布宁大冰川]
      description: >-
        金利·艾沿南海岸、公路和卡尔加维山脉东行南下，来到埃斯特领地拜访埃斯文年迈的父亲及继承人索尔夫，带来冰川日记并讲述埃斯文的死亡、外星人和其他生命。

