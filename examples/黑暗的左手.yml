      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 戈布宁大冰川, 奥格雷纳, 卡尔海德]
      description: >-
        两人在营地决定不走海路或公路，而向北翻山、向东横越约600英里的戈布宁大冰川，
        再经森西沼泽抵达卡尔海德边境，全程约800英里，以避开检查站和有人居住区。
    启程穿越森林:
      start_time: [2, 1, 8]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 塔润帕斯森林, 山本森山脉]
      description: >-
        次日黎明，两人足蹬雪鞋、拖着超过300磅的雪橇出发。埃斯文负责配给食物，
        两人每日行进约15至20英里，穿过与普利芬相邻的梭树森林。
    捕获帕斯瑞兽:
      start_time: [2, 1, 11]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 塔润帕斯森林]
      description: >-
        穿越塔润帕斯森林第三天，埃斯文设下陷阱捕获六只帕斯瑞兽，取肉炖食并保存皮毛；
        随后两人遭遇融雪和连日阴雨，在泥浆山坡上艰难前进。
    抵达戈布宁冰墙:
      start_time: [2, 1, 16]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 山本森山脉, 戈布宁大冰川]
      description: >-
        旅程第九天，两人走出雨云，抵达山本森山脉火山高原和隘口，望见横越峡谷的冰墙及其后的戈布宁大冰川。
        他们收起车轮、换上滑雪板，向北进入火与冰的荒漠。

