      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 德莱梅戈山, 德纳姆勒山]
      description: >-
        二月一日，两人抵达德莱梅戈山西坡；二月二日下冻雨，雪橇轮轴折断，改用滑橇进入火山间冰川。
        德纳姆勒山喷发，烟、硫磺和火山灰遮蔽天空，冰川裂谷迫使他们反复寻找道路。
    登上戈布宁大冰川:
      start_time: [2, 2, 9]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 德莱梅戈山, 德纳姆勒山, 戈布宁大冰川]
      description: >-
        二月九日，旅程第23天，两人找到铺着火山熔碴的捷径，登上戈布宁大冰川并重新向东。
        他们讨论火山活动、冰川世纪退隐及无法证明的气候理论。
    冰原上的孤独讨论:
      start_time: [2, 2, 10]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 戈布宁大冰川, 奥格雷纳, 卡尔海德]
      description: >-
        二月十日，两人在火山黑幕后继续东行。夜间谈论孤独、性别、异性社会与汉达拉特整体观，
        并吟诵托梅尔关于"光明是黑暗的左手，黑暗是光明的右手"的诗句。

