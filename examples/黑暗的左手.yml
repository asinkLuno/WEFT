aqueduct:
  gethen:
    runtime: rhai
    kind: calendar
    api: 1
    source: ./calendars/gethen.rhai

story:
  title: 黑暗的左手
  description: >-
    《黑暗的左手》是厄休拉·勒古恩的科幻经典，故事发生在终年冰封的格辛星
    （冬季星）。艾克曼特使金利·艾只身来到这颗星球，试图说服卡尔海德与
    奥格雷纳两国加入星际联盟。他面对的不仅是严寒与政治漩涡，还有格辛人
    独特的双性同体生理——每二十六天经历一次克母恋周期。在卡尔海德国王
    的猜忌、首相埃斯文的暗中相助与背叛、奥格雷纳的秘密警察追捕之间，
    金利·艾一步步走向命运的极点：与埃斯文一起穿越八百里戈布宁大冰川。
    本书融合了星际外交、极地生存、性别哲学与格辛星古老的创世神话与传说。
  date_mode: gethen

moai:
  金利·艾:
    description: >-
      来自地球的艾克曼第一特使，全书主要叙述者。因近光速飞行的时间跃迁，
      实际出生于120年前。到达冬季星近两年，往返于卡尔海德与奥格雷纳之间，
      致力于推动格辛星加入艾克曼联盟。先后被卡尔海德冷遇、被奥格雷纳逮捕
      投入普利芬农场药物审讯，在埃斯文舍命救援下穿越戈布宁大冰川八十天
      返回卡尔海德，最终促成纳芙尔号飞船在阿斯顿·芬着陆。在格辛人眼中
      是始终处于克母恋期的"性变态"，在孤独中艰难学习理解格辛人的双性
      同体、荣誉原则（shifgrethor）和拐弯抹角的表达方式。
  瑟尔瑞姆·哈尔斯·列米尔·埃斯文:
    description: >-
      埃斯特领地勋爵，卡尔海德前首相（"国王的耳朵"）。在汉达拉隐居村
      受过静默功训练，具有预感天赋和发功（kshshoyi）能力。因暗中推动
      萨斯洛斯边境农民东迁化解西洛斯峡谷争端、支持艾克曼使命而被蒂帕
      陷害，以叛国罪被放逐。流亡奥格雷纳后在鱼岛做冷冻鱼装卸工，后为
      叶基收留为秘书。在金利·艾落入普利芬后伪造证件越狱孤身救人，
      两人共同穿越戈布宁大冰川回到卡尔海德，在边境为引开哨兵冲向枪口
      牺牲，临死呼唤已故兄长阿瑞克的名字。他忠实于友谊和光明，始终是
      唯一完全信任金利·艾的格辛人。
  阿加文十五世:
    description: >-
      卡尔海德国王，偏执而情绪化。在元年图瓦月第22日的庆典上亲自用
      掺动物血的红色水泥砌合江门拱顶石。因听信蒂帕而放逐忠臣埃斯文，
      之后陷入孤立的恐惧中。曾宣布怀孕期待亲生继承人，但新生儿一小时后
      夭折。最终在金利·艾穿越大冰川归来后幡然醒悟，准许纳芙尔号在
      阿斯顿·芬着陆，但在埃斯文死前始终拒绝撤销放逐令。后期由法克斯
      入阁担任决策委员。
  帕米尔·哈格·列米尔·蒂帕:
    description: >-
      阿加文国王的表弟，野心勃勃。在庆典后以满口双关语试探警告金利·艾。
      趁埃斯文失宠成为首相（"国王的耳朵"），擅用广播煽动民族自豪感、
      恐惧与对奥格雷纳的仇恨，鼓吹西洛斯峡谷的领土要求。试图将卡尔海德
      从后封建氏族社会引向民族国家和战争道路，但缺乏见好就收的智慧。
      在埃斯文死亡消息传出后辞职垮台。
  艾尔亨朗:
    description: >-
      卡尔海德首都，一座幽暗的古老石城，遍布塔楼、宫殿与修道院。王宫
      是城中城，内有红厅、柱石红楼、圆塔楼等建筑。雷姆利钟楼报时。
      故事开头图瓦月第22日的游行庆典和江门拱顶落成仪式在此举行。
  江门拱顶:
    description: >-
      连接艾尔亨朗新公路与河港的宏伟石拱门，疏浚河道、建造拱门和修筑
      公路历时五年。庆典当天阿加文十五世赤脚登上脚手架，亲自用掺动物血
      的粉红色水泥细致砌合拱顶石的两面——按传统拱顶石须用人骨人血，
      现在改用动物血。
  柱石红楼:
    description: >-
      埃斯文在王宫内的府邸，440年前为阿加文三世的宠妃哈姆斯建造。
      花园小巧，一泓池水，芙蓉树垂荫。金利·艾在庆典当晚受邀到此与
      埃斯文独处晚餐，正是在这里埃斯文宣布不再代表他同国王交涉。
  圆塔楼:
    description: >-
      艾尔亨朗王宫内接待友好国家大使的宾馆，标志着崇高的礼遇。金利·艾
      从萨斯洛斯返回艾尔亨朗后在此下榻，与入阁的法克斯商议飞船无线电
      导航、着陆地点和接待礼仪。从此处可见柱石红楼前的池塘和枯树。
  卡尔海德:
    description: >-
      格辛星上的古老王国，阿加文十五世统治。政治结构为后封建氏族经济
      体制，由各领地、家族和部落松散联合而成，从未真正统一。卡尔海德
      人意志倔强、重荣誉原则（shifgrethor），但缺乏动员能力和民族国家
      意义上的爱国主义。始终生活在"元年"循环中，与奥格雷纳在西洛斯
      峡谷存有领土争端。
  奥格雷纳:
    description: >-
      卡尔海德的邻国，由33位总督组成的委员会统治。正从松散公社演变为
      中央集权的民族国家，拥有萨尔夫（内务部秘密警察/常设调查机构）
      和志愿农场等国家机器。政府秘密运作，严格控制通讯和思想。与卡尔
      海德在萨斯洛斯附近的北秋高原西洛斯峡谷存在边境争端，曾发动越境
      袭击烧毁卡尔海德粮仓。
  格辛星:
    description: >-
      冬季星，艾克曼名称"格辛"。公转周期0.96地球年（约8401小时），
      自转周期23.08小时，一年376天。14个月，每月26天。气候严寒，
      生存条件苛刻。人类在此分两性——格辛人是潜在雌雄同体，有26至
      28天的克母恋周期。社会结构、工业、农业皆按克母恋周期建立。
  艾克曼:
    description: >-
      金利·艾所代表的人类星际联盟，前身为已知星球艾克曼大家庭。宗旨
      是协调而非统治各成员国和成员星球，通过协商和多数代表同意做出决定。
      拥有83颗可住人行星和约3000个民族。起源星为汉恩星。强调开端而非
      目的，"万事开头至关重要"。
  米西洛瑞:
    description: >-
      奥格雷纳第一大城市，也是行政首都。城市建筑风格怪异——灰色石墙、
      高悬的小窗户、宽阔街道，设计初衷是为了抵御冬天15英尺深的积雪。
      孔德瑞尔河流经城中。市内有总督政府大厅、克母恋剧院等建筑。
      金利·艾在此出席宴会、向33位总督发表演说，后被逮捕。
  荷西荷尔德隐居村:
    description: >-
      距列米尔不远的汉达拉特隐居村，掩映在赫曼树林中。金利·艾在此
      生活半个月，参加田间劳动、种花、伐木和维修。村中有上锁的大厅
      用于每月18日的预言聚会，隐士们修练"静默"功（在汉达拉特语中
      反称为"清醒"状态），跳自由宣泄的舞蹈至深夜。
  列米尔:
    description: >-
      卡尔海德古城，古代国王的居住地。建于17个世纪前，城市没有街道，
      只有如隧洞般的带顶人行道，春天洪水泛滥时市民划船出行。城内遍布
      血红色、无窗的钟楼，曾作为王宫达千年之久。金利·艾在离开艾尔亨朗
      第四天抵达此处。
  戈布宁大冰川:
    description: >-
      横亘奥格雷纳北部的大冰川，东西宽约600英里，通向卡尔海德东北境的
      戈森湾。金利·艾和埃斯文从此穿过，全程约800英里。冰川中心为高压
      带，周边有暴风雪地带，南缘多冰裂谷。两人在第23天登上大冰川，
      在第75天走下冰川抵达戈森湾。
  普利芬国家第三志愿农场:
    description: >-
      奥格雷纳第30区的惩罚性劳动营（移民点）。位于茫茫梭树森林边缘，
      毗邻塔润帕斯森林和塔鲁夫镇。囚犯约150人，在锯木厂和加工厂劳动，
      全部服用抑制克母恋的药物，政治犯每隔五天接受药物审讯。无医院，
      准则是不干活就是死亡。金利·艾在此被反复药审导致身体严重受损，
      同伴阿斯纳病逝。
  萨斯洛斯:
    description: >-
      艾河东岸、靠近西洛斯峡谷的卡尔海德边境小镇，约有几千居民。设有
      贸易学校，拥有公用无线电发射台。另有"当选领主塔楼"用于囚禁。
      金利·艾在此出售夏帕炉购买十分钟发射时间，唤醒纳芙尔号飞船。
      埃斯文死后金利·艾被押回此处养病。
  纳芙尔号:
    description: >-
      金利·艾所属的艾克曼宇宙飞船，全称"纳芙尔—20号"有人驾驶星际
      飞船。不在格辛星着陆而在环绕太阳的轨道上运行，乘员保持静止休眠
      状态（每四年自动脱离一次）。可由萨斯洛斯贸易学校的发射台通过
      中继卫星唤醒。最终在阿斯顿·芬平稳着陆，朗赫幽率11名人员下船。
  法克斯:
    description: >-
      荷西荷尔德隐居村的预言家和天生倾听者（通灵者），具有强大的移情
      能力和控制预言家集体感应的天赋。面容俊美如雕像。在金利·艾的预言
      聚会中担任中心，在黑暗中浑身燃烧如穿铠甲的女人，喊出"是呀"——
      即格辛将在五年内加入艾克曼。后入阁担任银项链大臣，参与飞船着陆
      安排。
  戈斯:
    description: >-
      荷西荷尔德隐居村的年轻隐士，友善而幽默。
      在森林中遇见金利·艾并为其做向导，用反话解释汉达拉特教义，
      告诫无法回答的问题会毁掉预言家。已在此修行三年。
  叶基:
    description: >-
      奥格雷纳米西洛瑞总督（第一区），自由贸易派成员。身材清瘦，举止
      狡猾精干。在鱼岛找到流亡的埃斯文，替他还债并带回府邸重新登记为
      秘书和随从。与奥布梭同为统治奥格雷纳的32人集团成员。
  奥布梭:
    description: >-
      埃塞克务区总督，身材矮小、胸部凹陷。奥格雷纳自由贸易派领袖，
      为33位总督中最接近诚实的成员之一。在金利·艾到来问题上犹豫不决，
      最终因害怕萨尔夫而牺牲金利·艾。与埃斯文建立了一定程度的互信。
  万纳卡·斯洛思:
    description: >-
      奥格雷纳第三区总督（科威尔纳），身材瘦削，目光明亮。理想主义者，
      将约米西教神秘主义嫁接到金利·艾的使命上，主张"必须净化灵魂
      迎接新人类"。领导委员会打击克母恋剧院的淫秽戏剧。为自由贸易派
      成员，试图说服33位总督支持外星飞船登陆。
  萨斯基恩:
    description: >-
      奥格雷纳第一区入境道路与港口总督，身材壮实，笑容可掬。在米西洛瑞
      接待金利·艾，安排其住在自己府邸的豪华套房。为人精明快活，但实为
      萨尔夫特务。在埃斯文敲诈下透露了金利·艾被押送普利芬的信息。
  萨尔夫:
    description: >-
      奥格雷纳内务部常设调查机构，绰号"垃圾"。负责调查虚假注册、
      非法旅行、伪造证件等事务，实质上充当秘密警察，严密控制广播、
      新闻、科技报刊和通讯。支配33位总督中20个席位。将金利·艾送进
      普利芬农场的幕后操纵者，最终因谎言暴露而失势。
  奥格雷纳总督委员会:
    description: >-
      由33位总督组成的奥格雷纳政府机构。萨尔夫集团长期控制多数席位，
      自由贸易派为少数。金利·艾在政府大厅向全体总督发表演说要求公开
      保证飞船安全，但受到主流派嘲讽和指控，会议未有结果。
  阿斯纳:
    description: >-
      普利芬农场的木匠囚犯，已在农场近一年。患有肝病，与金利·艾在病中
      同住同铺。常给金利·艾讲孔德瑞尔峡谷国营农场的回忆和奥格雷纳
      民间故事。两人谈论故事、外星人和"选择"——阿斯纳说"我们谁
      也没有选择"，随后陷入昏迷病逝。
  朗赫幽:
    description: >-
      纳芙尔号飞船的船员，率领十一名艾克曼人员在阿斯顿·芬登陆的第一位
      成员。使用卡尔海德语庄严宣布"我带着友谊而来"。在艾克曼的岁月中
      对金利·艾来说只过了短短几周——她（女性）作为金利·艾离开后
      第一个见到的同胞。
  阿西:
    description: >-
      埃斯文的克母恋配偶，脖子上戴有预言家禁欲主义者的金项链。两人
      共同生活七年，养育两个儿子。三年前去了奥格利隐居村。在埃斯文被
      放逐时赶到科斯本城门等候，试图同行但被拒绝，后托金利·艾转交
      钱款给埃斯文。
  福里斯·列米尔·奥斯勃思:
    description: >-
      奥格利隐居村的隐士，佩戴代表预言家和隐士身份的金项链。是埃斯文
      的克母恋配偶和两个儿子的另一位父亲。为帮助落难的埃斯文，收回
      埃斯文遗留的资产和债权，委托金利·艾带入奥格雷纳转交。
  瑟西切尔:
    description: >-
      萨斯洛斯附近郊外的农场主，埃斯文年轻时在管理局当秘书时的老朋友。
      曾在埃斯文帮助下买下农场。最初被埃斯文的落魄震惊，后热情招待
      两人，答应为埃斯文寻找藏身处。但翌日清晨用无线电向蒂帕告密，
      迫使两人紧急逃亡，最终导致埃斯文在边境牺牲。
  萨斯洛斯年轻医生:
    description: >-
      在萨斯洛斯当选领主塔楼中照料金利·艾的医生，严肃而慈祥。诊断
      金利·艾"营养不良，劳累过度已有五六个月，元气耗尽"，劝他如
      江河般静静休养。后护送金利·艾乘机动雪橇返回艾尔亨朗。他坚信
      哈尔斯·瑟尔瑞姆·伊尔·埃斯文不会自杀。充满卡尔海德精神的勇气
      与欣喜。
  埃斯万斯·哈尔斯·瑟尔瑞姆·伊尔·埃斯文:
    description: >-
      埃斯特老领主、埃斯文和阿瑞克的父亲。晚年因风湿关节炎致下肢瘫痪，
      坐在轮椅上。当金利·艾拜访埃斯特时，他脸上看不出特别的悲伤或
      安慰，平静得可怕，岩石般坚韧。儿子阿瑞克和瑟尔瑞姆都先他而去。
  索尔夫·哈尔斯:
    description: >-
      埃斯特领主继承人、埃斯文之孙。最初在金利·艾抵达埃斯特时为开门
      人，沉默寡言风度如少女。后从阴影中走出，质问"在艾尔亨朗他们
      仍然叫他叛国贼埃斯文"。渴望从金利·艾口中追问祖父的死亡和外星
      世界的详情。
  马瑞万:
    description: >-
      艾斯文港的老年捕猎者，熟悉山本星北部荒野和火山。带领捕猎队沿
      艾萨格尔江北上，埃斯文溯江而上从他那里学会了大量穿越冰川所需的
      荒野知识。
  塔鲁夫镇:
    description: >-
      奥格雷纳西北部边境小镇，位于普利芬农场西南数英里。埃斯文在此装病
      离开捕猎队，将装备藏在隐秘山谷，后又在镇上伪造"瑟勒尔·本思"
      假释犯证件，冒充看守进入普利芬农场。之后在此偷窃食物给养用于
      冰川穿越。
  乌登纳斯瑞克山:
    description: >-
      埃斯文救出金利·艾后的秘密营地附近可见的火山山脉。埃斯文在帐篷外
      看见东方远处高空中该山飘移的灰色烟雾。是该火山群中离帐篷最近的
      一座。
  艾斯文港:
    description: >-
      艾萨格尔江湾的灰色港口城市，灰色的岩石建筑，大街小巷荡漾着湿润的
      海风。当地渔夫性格凶悍、说话直率。埃斯文在此获得狩猎许可证并加入
      了马瑞万老人的捕猎队。
  塔润帕斯森林:
    description: >-
      毗邻普利芬农场的广袤梭树森林，方圆数千英里，多节矮小的针叶树
      密布。金利·艾和埃斯文逃亡初期用三天时间穿过此森林。
  山本森山脉:
    description: >-
      位于奥格雷纳西北部的火山山脉区域，覆有近期造山与硫化过程的痕迹。
      两人在此经历多日阴雨和泥泞后登上海拔五六千英尺的高原，进入火山
      区域。在旅程第九天从隘口尽头望见戈布宁冰川的巨型冰墙。
  德莱梅戈山:
    description: >-
      戈布宁大冰川前的火山之一，在奥格雷纳地图上有标名。埃斯文和金利·艾
      从西面矮坡攀登此山，然后下山进入它与德纳姆勒山之间的火山间冰川。
      该山西坡陡峭、怪石林立。
  德纳姆勒山:
    description: >-
      横跨火山间冰川的火山，金利·艾和埃斯文穿越冰隘口时正在喷发。
      冻雨带有烟味和硫磺气味，冰川上覆盖火山碴与尘埃。火山喷出的大块
      岩石落在附近，撞击冰地燃出窟窿。冰川在脚下微微颤抖。
  艾歇尔豪斯悬崖:
    description: >-
      金利·艾和埃斯文在大冰川第35天左右看见的巨大黑色
      悬崖，从虚空冰原中赫然显现，无数黑色触须向上扭动。悬崖北面
      还有冰原岛峰犬牙交错，如同冰山奇观，沉没在冰地中的大山。
  冰原岛峰:
    description: >-
      戈布宁大冰川上突出的尖锥形岩峰，犬牙交错，伸入冰地以上数百英尺，
      如沉没的山群顶峰露出冰面。金利·艾向南方向东南转向，最终走向戈森湾。
  戈森湾:
    description: >-
      戈布宁大冰川南缘以外的冰封海湾，连接卡尔海德北方的北极海域。
      金利·艾和埃斯文在旅途第75天走下大冰川抵达此处冰海，丢弃雪橇
      沿海岸步行向卡尔海德村庄。
  艾河:
    description: >-
      流经萨斯洛斯与西洛斯峡谷之间的界河，水流湍急，来自冰川融水。
      冬季冰封。金利·艾从巴斯瑞尔村过桥进入奥格雷纳，最后又和埃斯文
      穿冰河返回卡尔海德一侧。
  西洛斯峡谷:
    description: >-
      卡尔海德与奥格雷纳之间有争议的边境峡谷地区。阿加文十五世的祖父
      宣称其为卡尔海德领土但从未被承认。埃斯文曾帮助居住在此的卡尔海德
      农民东迁以消除争端。蒂帕在此处宣扬领土要求煽动民族情绪。萨斯洛斯
      小镇位于该峡谷东侧。
  库库尔斯特:
    description: >-
      卡尔海德戈森湾冰海边缘的村庄，位于寒冷偏僻的北方海岸线，居民为
      仅能维持温饱的渔民。金利·艾与埃斯文在第75天走下戈布宁冰川后
      进入此村，在熟食店受到村民欢迎和款待。埃斯文在此向村民讲述了
      穿越大冰川的英雄传奇。
  阿斯顿·芬:
    description: >-
      艾尔亨朗东北约30英里的辽阔泥炭沼泽荒原，不适于耕作或居住。
      艾克曼飞船纳芙尔号的预定着陆点。早春五月中旬的暮色中，
      飞船在无线电信标导航下在此平稳着陆，喷出大量白色蒸气和水花。
  埃斯特领地:
    description: >-
      克姆国（后属卡尔海德）的领地，埃斯文及其家族的故土。位于南海岸
      山区，灰色岩石建筑依山而建，朔风呼啸，荒凉而寒冷。与斯托克领地
      因土地争端世代仇杀三代，后由埃斯特瑟瑞姆割让一半争议土地终结
      仇杀。
  斯托克领地:
    description: >-
      克姆国领地，与埃斯特领地因边境沃土争端世代仇杀三代。由斯托克的
      瑟瑞姆与埃斯特瑟瑞姆立下和平誓约后，埃斯特割让土地，仇杀终结。
  无名故事讲述人:
    description: >-
      《炉边传奇》中的无名讲故事人，第二章格恩瑞传说的叙述者。该故事
      录音带存于艾尔亨朗历史大学档案室，是在阿加文八世王期间录下来的。
  格恩瑞:
    description: >-
      夏斯领地的两兄弟中的兄长。与胞弟霍德盟誓婚恋，霍德怀孕后被领主
      强令分手而自杀。格恩瑞遭到谴责和放逐，向北逃入白令冰川，在冰雪
      腹地见到已死的霍德，拒绝留下后第九天被奥尔霍奇居民救起，失去了
      左手。晚年改名为恩诺克在雷尔平原居住，临终收回名字和诅咒，夏斯
      遂恢复繁荣。
  霍德:
    description: >-
      格恩瑞的胞弟和克母恋人。怀孕后接到领主撕毁婚誓的命令，哀恸自杀。
      死后以雪白形体现身在白令冰川腹地，邀请格恩瑞留下共居，因说不出
      哥哥的名字而被拒绝。
  伯劳斯特·列米尔·伊彭:
    description: >-
      东卡尔海德贵族，以四十颗绿宝石和果园一年收成求问预言家奥德伦
      自己的死期，得到"任何月的第十九天"的答案。从此将自己囚禁在
      沙鲁德领地钟楼，每月18、19日绝食。因误解赫尔勃带回的预言而
      砸死配偶，最终于元月第19日在奥迪斯特悬梁自尽。
  赫尔勃:
    description: >-
      格甘纳尔氏族成员，伯劳斯特的克母恋配偶。为解救被"十九天"预言
      折磨的伯劳斯特，以自己生命作代价向预言家求问。带回"伯劳斯特将
      比赫尔勃活得久"的预言，却被伯劳斯特误解，用红石桌面砸死。
  奥德伦:
    description: >-
      坦格尔恩隐居村的预言家，性格冷酷而遵循规则。先后回答伯劳斯特和
      赫尔勃的问题，每次回答都精确但含混，直接或间接导致悲剧。名言：
      "人当然会死的：人不死于自己的死亡，还会死于什么呢？"
  阿瑞克:
    description: >-
      埃斯特领地领主继承人，埃斯文的亲兄长。在伊尔母冰湖因破冰落水，
      被世仇斯托克的瑟瑞姆救下，两人立誓克母恋。第三天被斯托克人当着
      瑟瑞姆的面刺杀。其名字在埃斯文临死前被呼出，也是金利·艾用心灵
      语言呼唤埃斯文时埃斯文听到的声音。
  斯托克的瑟瑞姆:
    description: >-
      斯托克领主之子，与埃斯特世代仇敌。在冰湖木屋救下阿瑞克并发誓
      克母恋，但部下当场杀死了阿瑞克。他流放了违令的部下后去罗斯瑞尔
      隐居村隐居一年。多年后与阿瑞克之子再次在冰湖相遇，立下和平誓言，
      终结代代仇杀。
  翁·托特·奥朋:
    description: >-
      艾克曼探险家，首位登上格辛星（冬季星）的记录者。于艾克曼历1448年
      9月3日、格辛星第81天记录实地观察。撰写了关于格辛人性生理的经典
      报告，分析了26至28天的克母恋周期、两性同体、社会结构及格辛社会
      缺乏战争的原因，认为格辛人生活的决定性因素是冰川世界本身。
  大祭司图胡尔姆:
    description: >-
      《大祭司图胡尔姆箴言集》的作者，约900年前在奥格雷纳北方写成。
      第十二章摘录其关于米西主位于时间中心、过去现在未来同时存在的
      约米西教规。
  米西主:
    description: >-
      约米西教的至高神祇，位于时间中心，洞见过去、现在与未来。曾在
      大地生活30年，睁眼后万物尽收眼底，又活了30年。在米西主眼中
      一切都是星星，没有黑暗，没有死亡。据传说原为预言家米西。
  艾当都拉斯:
    description: >-
      奥格雷纳创世神话中首先醒来的巨大冰团，站起来时头戳破天空，大雪
      纷纷。杀死除两个人以外所有醒来的兄弟（39人中的37人），用兄弟
      们的冰冻尸体建造房屋。在克母恋梦中躁动不安，最后与逃走的年轻
      兄弟交媾，从其血肉和子宫中诞生民族。
  艾森帕斯手抄本记录者:
    description: >-
      记录艾森帕斯洞穴神祠中史前创世神话的无名作者。该手抄本早于约米西
      教诞生，是约米西教诞生前保存下来的原始版本。
  托波德·乔哈瓦:
    description: >-
      在东卡尔海德戈恩赫恩领地讲述"第十九天"传说的人。
      金利·艾记录的该版本源自托波德·乔哈瓦的口述。

