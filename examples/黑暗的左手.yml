      description: >-
        金利·艾因总督们在约米西节日中失联而感到不安；深夜被陌生人宣布逮捕，押入监狱，
        在药物作用下接受审讯，醒来时已被装进无窗商旅卡车。
    押送志愿农场:
      start_time: [1, 14, 5]
      moais: [金利·艾, 普利芬国家第三志愿农场, 奥格雷纳]
      description: >-
        卡车载着约26名囚犯翻越山脉，数日后抵达普利芬国家第三志愿农场。囚犯被洗澡、换衣、分组，
        在锯木厂和加工厂劳动；所有人被服用抑制克母恋的药物，政治犯每隔五天接受一次药物审讯。
    与阿斯纳交谈:
      start_time: [1, 14, 12]
      moais: [金利·艾, 阿斯纳, 普利芬国家第三志愿农场]
      description: >-
        金利·艾在反复药审后病弱不堪，与木匠阿斯纳同住。两人谈论故事、外星世界、克母恋和"选择"；
        阿斯纳说"我们谁也没有选择"，随后陷入昏迷并病逝。金利·艾被再次抬去审讯，章末失去记忆。

  埃斯文越狱救援:
    离开米西洛瑞:
