      description: >-
        元月24日，两人在冰川长臂与死亡谷之间选择绕行火山间冰川；元月25、26日因连续拉雪橇而休整，
        玩地球的"走"游戏，并协调帐篷温度和食物消耗。
    火山冰隘口受阻:
