drift:
  古代传说与档案:
    冰团造天地:
      start_time: [-1000]
      moais: [金利·艾, 艾森帕斯手抄本记录者, 艾当都拉斯, 戈布宁大冰川]
      description: >-
        史前手抄本中的奥格雷纳创世神话：冰团融化形成山脉、海洋、河流、土壤、植物、
        动物和人类，三座冰团又融化成牛奶使沉睡的39人醒来。艾当都拉斯杀死37个兄弟，
        与最后一位兄弟交媾，从血肉和子宫中诞生民族；每个孩子身后都有黑影，
        象征死亡随生而来，终将吞没光明。
    时间与黑暗:
      start_time: [-899]
      moais: [金利·艾, 大祭司图胡尔姆, 米西主]
      description: >-
        约九百年前写成的《大祭司图胡尔姆箴言集》摘录。米西主位于时间中心，
        过去、现在与未来同时存在；穷人席勒从石头田挖出珠宝，却被预示未来将葬身于此。
        奥伦森林的古赫姆树藏有一片无法被看见的叶子，米西主将其摘下。
        箴言否定开始、结束、黑暗与死亡，宣称万物都在同一视野和同一光芒中。
    格恩瑞传说:
      start_time: [-199]
      moais: [金利·艾, 无名故事讲述人, 格恩瑞, 霍德]
      description: >-
        约两百年前，夏斯领地的两兄弟格恩瑞与霍德盟誓婚恋；霍德怀孕后奉命分手，
        随即自杀，格恩瑞被放逐。他向北逃入白令冰川，在冰雪腹地遇见死去的霍德，
        拒绝留下后向南逃亡；第九天被奥尔霍奇居民救起，失去左手。晚年他在雷尔平原
        改名恩诺克，收回自己的名字和诅咒后病逝，夏斯遂恢复繁荣。
    叛徒埃斯文:
      start_time: [-199]
      moais: [金利·艾, 阿瑞克, 斯托克的瑟瑞姆, 埃斯特领地, 斯托克领地]
      description: >-
        塔布塔·科尔哈瓦口述、金利·艾记录的东部传奇。埃斯特继承人阿瑞克在冰湖遇险，
        被世仇斯托克的瑟瑞姆救下，两人发誓克母恋，却在第三天被斯托克人杀死阿瑞克而分离。
        斯托克的瑟瑞姆随后隐居；一年后婴儿被送回埃斯特，取名瑟瑞姆。成年后的埃斯特瑟瑞姆
        杀死企图伏击他的兄长，在冰湖木屋再次遇见年长的斯托克瑟瑞姆，立下和平誓言，
        割让争议土地终结仇杀，却因此被称为"叛徒埃斯文"。
    性问题报告:
      start_time: [-42, 4, 3]
      moais: [金利·艾, 翁·托特·奥朋, 格辛星, 艾克曼]
      description: >-
        艾克曼探险家翁·托特·奥朋记录于艾克曼历1448年9月3日、格辛星第81天。
        报告推测格辛人的性生理可能源于远古殖民实验，分析26至28天的克母恋周期、
        潜伏期、动情期、怀孕和哺乳期，并讨论两性同体如何塑造家庭、劳动、社会结构及战争缺失。
        报告最后认为，格辛人生活的决定性因素也许不是性或气质，而是冰川世界本身。
    第十九天的预言:
      start_time: [1, 1, 19]
      moais: [金利·艾, 托波德·乔哈瓦, 伯劳斯特·列米尔·伊彭, 赫尔勃, 奥德伦]
      description: >-
        东卡尔海德传说，托波德·乔哈瓦口述。伯劳斯特·列米尔·伊彭以四十颗绿宝石和果园
        一年收成求问死期，预言家奥德伦只回答"任何一个月的第十九天"。伯劳斯特因此囚禁自己，
        每月十八、十九日绝食等待。其配偶赫尔勃以生命作价求问，得到"伯劳斯特将比赫尔勃活得久"
        的回答；伯劳斯特误解后砸死赫尔勃，最终于元月第十九日自尽。

  元年图瓦庆典:
    游行穿城:
      start_time: &celebration_day [1, 7, 22]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 阿加文十五世, 帕米尔·哈格·列米尔·蒂帕, 艾尔亨朗, 卡尔海德]
      description: >-
        元年奥德哈尔哈哈德·图瓦，雨中的游行队伍穿过艾尔亨朗。
        金利·艾紧跟杂耍队，走在国王之前，并在看台上与埃斯文交谈。
    国王合拱顶石:
      start_time: [0, 0, 0, *celebration_day]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 阿加文十五世, 帕米尔·哈格·列米尔·蒂帕, 艾尔亨朗, 江门拱顶, 卡尔海德]
      description: >-
        阿加文十五世登上脚手架，亲自用掺动物血的粉红色水泥细致砌合拱顶石两面，
        完成连接新公路和河港的工程。
    庆典散场:
      start_time: [0, 0, 0, *celebration_day]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 阿加文十五世, 帕米尔·哈格·列米尔·蒂帕, 艾尔亨朗, 江门拱顶, 卡尔海德]
      description: >-
        天气由雨转晴又转为寒风浓云，游行结束，半小时后开始下雪。
        埃斯文邀请金利·艾共进晚餐，蒂帕随后一路试探并暗示危险。
    前往红楼:
      start_time: [1, 7, 22, 4]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 艾尔亨朗, 柱石红楼]
      description: >-
        雷姆利钟楼敲响下午四点，金利·艾进入王宫，前往柱石红楼赴埃斯文的晚宴。
    埃斯文撤回支持:
      start_time: [1, 7, 22, 4]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 阿加文十五世, 柱石红楼, 卡尔海德, 奥格雷纳, 艾克曼]
      description: >-
        晚餐后，埃斯文说明自己已经失宠，不再代表金利·艾同国王交涉。
        他谈及边境争端、卡尔海德日益滋长的爱国主义恐惧，以及国王对艾克曼的猜忌，
        但仍表示相信金利·艾。
    雪夜告别:
      start_time: [1, 7, 22, 6]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 艾尔亨朗, 柱石红楼]
      description: >-
        雷姆利钟楼敲响六点，金利·艾告辞。埃斯文表示仍想了解心灵语言；
        两人在月下雪地告别，金利·艾独自回家，感到寒冷、孤独和前途未卜。

  元年图瓦第23日:
    王宫公告放逐埃斯文:
      start_time: [1, 7, 23, 8]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 阿加文十五世, 卡尔海德, 艾克曼]
      description: >-
        七月二十三日八点，王宫公告宣布埃斯文犯叛国罪：革去首相和议员职务，
        驱逐出王国及卡尔海德所有领地，任何人不得与他交谈或收留。公告指控他鼓吹
        卡尔海德自治领地放弃主权、向民族联盟交权。
    金利艾谒见国王:
      start_time: [1, 7, 23]
      moais: [金利·艾, 阿加文十五世, 艾克曼, 卡尔海德]
      description: >-
        金利·艾在下午两点接受阿加文十五世召见。他说明艾克曼希望与格辛各国结盟，
        介绍83颗有人星球、约3000个民族及即时通讯装置；国王却将艾克曼视为威胁，
        反复强调恐惧和卡尔海德自己的道路。
    斯特拜尔人答复:
      start_time: [1, 7, 23]
      moais: [金利·艾, 阿加文十五世, 艾克曼, 卡尔海德]
      description: >-
        金利·艾用发报机向汉恩星询问"卖国贼是什么"。皮摩勒代表斯特拜尔人
        回答说，没有人承认自己是卖国贼，因此很难发现卖国贼；国王认为答案不能证明任何事。
    离开王宫决定东行:
      start_time: [1, 7, 23]
      moais: [金利·艾, 阿加文十五世, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 艾尔亨朗, 卡尔海德, 奥格雷纳]
      description: >-
        国王允许金利·艾在卡尔海德自由行动。金利·艾虽未能完成结盟使命，仍决定暂不去奥格雷纳，
        离开艾尔亨朗宫廷，向东前往隐居村，从预言家处搜集情报。

  元年夏季东行:
    离开艾尔亨朗:
      start_time: [1, 8, 1]
      moais: [金利·艾, 艾尔亨朗, 卡尔海德]
      description: >-
        夏季第一月第一日，金利·艾卖出绿宝石，带着发报机、仪器和换洗衣物，
        随20辆电动两栖卡车组成的商旅车队向东出发，前往预言家隐居村。
    抵达列米尔:
      start_time: [1, 8, 4]
      moais: [金利·艾, 列米尔, 卡尔海德]
      description: >-
        离开艾尔亨朗第四天黄昏，车队抵达古城列米尔。金利·艾在城中投宿一夜，
        次日步行寻找列米尔附近的荷西荷尔德隐居村。
    进入荷西荷尔德:
      start_time: [1, 8, 5]
      moais: [金利·艾, 戈斯, 法克斯, 荷西荷尔德隐居村, 列米尔]
      description: >-
        金利·艾在荷西荷尔德遇见年轻隐士戈斯和预言家法克斯，说明自己是特使，
        并获邀在村中住下。他参加田间劳动、种花、伐木和维修，观察汉达拉特人的静默功。
    预言聚会:
      start_time: [1, 8, 18]
      moais: [金利·艾, 法克斯, 戈斯, 荷西荷尔德隐居村]
      description: >-
        该月18日，九位预言家在上锁大厅聚集。金利·艾提问"五年后格辛星会成为艾克曼成员吗"，
        预言家先称问题无法回答，随后在黑暗和集体感应中回答"是"。法克斯解释，预言更像观察而非神谕；
        金利·艾由此确认格辛将在五年后加入艾克曼大家庭。
    讨论无知与未来:
      start_time: [1, 8, 19]
      moais: [金利·艾, 法克斯, 荷西荷尔德隐居村, 卡尔海德, 奥格雷纳]
      description: >-
        预言后一两天，法克斯向金利·艾解释预言家的代价、天生倾听者和汉达拉特的"无知"。
        两人讨论国王为何不频繁求问预言家，以及不可知、不可预言和不可证明如何构成生活的根基。

  埃斯文流亡奥格雷纳:
    接到流放御令:
      start_time: [1, 7, 24, 9]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 阿加文十五世, 帕米尔·哈格·列米尔·蒂帕, 卡尔海德]
      description: >-
        埃斯文被国王信使唤醒，接到御令并看见流放公告钉在府邸门上。钟鼓九点时，
        他离开王宫，只带能带走的财物，写信给昔日配偶阿西却不敢署名。
    科斯本告别阿西:
      start_time: [1, 7, 26]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 阿西, 卡尔海德]
      description: >-
        三日宽限期的黄昏，埃斯文徒步抵达科斯本。阿西在城门等候，表示要与他同行，
        但埃斯文拒绝并独自赶往码头，准备乘船离开卡尔海德。
    划艇越境:
      start_time: [1, 7, 26, 5]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 奥格雷纳]
      description: >-
        码头没有奥格雷纳船只，埃斯文偷取划艇出海。蒂帕的人用声波枪击中他，
        科斯本巡逻艇仍坚持执行国王命令，将他拖上船并安全送过海湾。
    谢尔特医院获救:
      start_time: [1, 8, 1]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 奥格雷纳]
      description: >-
        埃斯文抵达奥格雷纳后昏倒，被送进医院。医生判断他受声波场损伤，
        并在督察员发现其非法入境后协助他申请奥格雷纳永久居住权。
    米西洛瑞谋生:
      start_time: [1, 8, 6]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 米西洛瑞, 奥格雷纳]
      description: >-
        五天后，埃斯文登记为米西洛瑞居民，随鲜鱼运输车队来到米西洛瑞，在冷冻库做装卸工。
        新的外国人登记法使他的注册失效，他在督察员接待室等待半个月，靠工友借钱和偷鱼度日。
    叶基收留埃斯文:
      start_time: [1, 10, 1]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 叶基, 米西洛瑞, 奥格雷纳]
      description: >-
        夏季将尽，叶基总督在鱼岛找到埃斯文，替他还债并带回府邸，重新登记为自己的秘书和随从。
    总督讨论金利艾:
      start_time: [1, 10, 26]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 叶基, 奥布梭, 金利·艾, 奥格雷纳, 卡尔海德, 艾克曼]
      description: >-
        一个雨夜，叶基和奥布梭向埃斯文追问他在萨斯洛斯及西洛斯峡谷争端中的目的，
        并询问金利·艾是否真是外星使者。埃斯文确认金利·艾没有撒谎，认为谁先打开艾克曼之门，
        谁就可能成为整个格辛星的首领；奥布梭表示需要一个月考虑是否相信。

  金利·艾进入奥格雷纳:
    东部氏族游历:
      start_time: [1, 11, 1]
      moais: [金利·艾, 卡尔海德]
      description: >-
        夏季期间，金利·艾以探索者而非特使的身份漫游卡尔海德，在氏族村落观察自治部落、
        儿童教育和没有工业革命的社会。汉卡纳月初，他听闻阿加文国王怀孕并期待亲生继承人。
    返回艾尔亨朗:
      start_time: [1, 12, 1]
      moais: [金利·艾, 阿加文十五世, 帕米尔·哈格·列米尔·蒂帕, 艾尔亨朗, 卡尔海德]
      description: >-
        秋天第一个月戈尔月初，金利·艾返回艾尔亨朗。阿加文在夏宫隐居，蒂帕担任摄政，
        通过广播煽动民族自豪、恐惧与对奥格雷纳的仇恨，并宣扬西洛斯峡谷袭击。
    福里斯托付钱款:
      start_time: [1, 12, 3]
      moais: [金利·艾, 福里斯·列米尔·奥斯勃思, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 艾尔亨朗]
      description: >-
        一位戴预言家金项链的隐士来访，自称福里斯·列米尔·奥斯勃思，请金利·艾把他收回的资产带给埃斯文。
        金利·艾答应寻找埃斯文并转交钱款；两天后收到奥格雷纳入境许可。
    进入苏文星村:
      start_time: [1, 12, 5]
      moais: [金利·艾, 奥格雷纳, 卡尔海德]
      description: >-
        金利·艾徒步离开艾尔亨朗，经边境桥梁渡过艾河，在奥格雷纳边境接受检查并等待证件核验。
        当夜边境村庄遭到突袭和纵火，他与其他逃亡者一起逃离，随后被公社农庄中心扣押盘问。
    抵达米西洛瑞:
      start_time: [1, 12, 8]
      moais: [金利·艾, 萨斯基恩, 万纳卡·斯洛思, 米西洛瑞, 奥格雷纳]
      description: >-
        金利·艾被认出后获优待，取得新护照和沿途住宿许可，由专车送往米西洛瑞。奥格雷纳第三区总督萨斯基恩
        接待他并安排在府邸居住；当晚万纳卡·斯洛思总督设宴，金利·艾在席间发现流亡的埃斯文，并亲手交付福里斯托付的钱款。

  米西洛瑞的政治会谈:
    埃斯文送还钱款:
      start_time: [1, 12, 9]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 萨斯基恩, 福里斯·列米尔·奥斯勃思, 米西洛瑞]
      description: >-
        抵达米西洛瑞次日，埃斯文登门取回福里斯托付的钱，并警告金利·艾不要成为奥格雷纳派系的工具。
        他指出，在奥格雷纳金利·艾不再是奇迹或怪物，而只是各派争夺的工具。
    国王亲生子夭折:
      start_time: [1, 12, 9]
      moais: [金利·艾, 阿加文十五世, 叶基, 奥布梭, 米西洛瑞, 卡尔海德]
      description: >-
        午宴上传来消息：阿加文国王的亲生骨肉出生一小时后夭折。宾客围绕王位继承和蒂帕摄政期限争论，
        金利·艾被追问卡尔海德局势及国王是否实际退位。
    介绍艾克曼联盟:
      start_time: [1, 12, 9]
      moais: [金利·艾, 叶基, 奥布梭, 万纳卡·斯洛思, 艾克曼, 奥格雷纳]
      description: >-
        金利·艾向总督和宾客解释艾克曼是协调经济、政治、教育与贸易的星际大家庭，而非统治性政府；
        他说明格辛若加入将成为第84颗成员星，并介绍通讯、飞船、贸易及互惠合作的可能。
    提议召唤纳芙尔号:
      start_time: [1, 12, 9]
      moais: [金利·艾, 纳芙尔号, 奥格雷纳总督委员会, 叶基, 奥布梭, 万纳卡·斯洛思, 艾克曼, 奥格雷纳]
      description: >-
        叶基、奥布梭等自由贸易派希望金利·艾发信号召来纳芙尔号，把飞船作为新纪元象征，
        以推动奥格雷纳与艾克曼联合。金利·艾要求奥格雷纳33位总督组成的委员会公开承诺飞船安全，
        才会允许登陆；奥布梭认可这一条件。

  埃斯文的米西洛瑞日记:
    总督争取多数:
      start_time: [1, 13, 6]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 金利·艾, 奥布梭, 叶基, 万纳卡·斯洛思, 奥格雷纳总督委员会, 奥格雷纳]
      description: >-
        米西洛瑞13月6日，奥布梭、叶基和斯洛思争取33位总督中的微弱多数，卡尔·伊斯鼓建议公开邀请纳芙尔号。
        埃斯文收到阿西的钱后不再寄居，开始在塑料厂工作，并反思金利·艾的使命和自己的误解。
    边境袭击与舆论封锁:
      start_time: [1, 13, 9]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 奥布梭, 叶基, 万纳卡·斯洛思, 萨尔夫, 卡尔海德, 奥格雷纳]
      description: >-
        13月9日，奥格雷纳越过艾河袭击卡尔海德特克姆贝尔粮仓；斯洛思试图用约米西神秘主义解释特使到来。
        13月10日，斯洛思领导委员会打击克母恋剧院的淫秽戏剧；埃斯文批评奥格雷纳与卡尔海德困在同一条道路上。
    萨尔夫控制消息:
      start_time: [1, 13, 13]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 金利·艾, 奥布梭, 萨斯基恩, 萨尔夫, 奥格雷纳]
      description: >-
        13月13日，广播继续封锁金利·艾的消息，萨尔夫严密控制通讯和思想。埃斯文质问奥布梭为何不公开宣传特使，
        奥布梭承认自己害怕萨尔夫控制的广播、新闻和科技报刊。
    戈姆诱骗埃斯文:
      start_time: [1, 13, 14]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 萨尔夫, 奥格雷纳]
      description: >-
        13月14日，戈姆把埃斯文当作卡尔海德间谍，试图利用其克母恋期诱骗他；埃斯文厌恶地拒绝，
        逃入公共克母恋公寓，坚持在流放期间清心寡欲。
    总督会议质询特使:
      start_time: [1, 13, 15]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 金利·艾, 奥布梭, 叶基, 万纳卡·斯洛思, 奥格雷纳总督委员会, 纳芙尔号]
      description: >-
        13月15日，金利·艾在33位总督会议上发言，说明纳芙尔—20号飞船和艾克曼使命，要求政府预先公开宣布登陆。
        阿尔悉尔主持质询，其他总督嘲讽并指控他是卡尔海德间谍、性变态者和骗局。
    发报机交给政府:
      start_time: [1, 13, 16]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 金利·艾, 奥布梭, 萨尔夫, 奥格雷纳总督委员会, 纳芙尔号]
      description: >-
