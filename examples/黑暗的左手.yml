      description: >-
        登上大冰川后，两人每天由指南针向东拉雪橇，日行12至18英里，在零下严寒、风暴和白茫中搭帐篷过夜。
        埃斯文坚持记录天气、路程和配给，夜间吟诵"赞美黑暗与未完成的造化"。
    心灵语言初次成功:
      start_time: [2, 3, 1]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 戈布宁大冰川, 阿瑞克]
      description: >-
        两人在冰川上讨论孤独、性别与友谊。金利·艾开始教埃斯文心灵语言；多次失败后，
        他在埃斯文睡梦中呼唤"瑟尔瑞姆"，埃斯文听见已故兄长阿瑞克的声音，终于建立最初的心灵联系。
    暴风雪与节食:
      start_time: [2, 4, 14]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 戈布宁大冰川]
      description: >-
        行程第40天后暴风雪将两人困住数日，埃斯文以训练过的耐饿功夫节食，要求金利·艾保持进食；
        随后他们又在零下严寒中前进，风暴将两人和雪橇短暂分离，心灵语言使金利·艾找到埃斯文。
    抵达艾歇尔豪斯悬崖:
      start_time: [2, 4, 21]
      moais: [金利·艾, 瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 戈布宁大冰川, 艾歇尔豪斯悬崖, 冰原岛峰]
      description: >-
        4月21日约中午，冰原虚空扭曲，金利·艾和埃斯文看见艾歇尔豪斯悬崖及其北面的冰原岛峰。
        雪橇里程已达约400英里，但弯路使实际进度不足一半；他们仍需继续向东穿越大冰川。


  回家:
