      description: >-
        13月19日中午，埃斯文以卡车装卸工身份离开米西洛瑞，先到皇家大使馆请人向卡尔海德传递消息，
        随后乘商旅车队西行，准备在道路封闭前抵达普利芬附近。
    前往艾斯文港:
      start_time: [1, 14, 13]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 艾斯文港, 马瑞万, 塔鲁夫镇, 奥格雷纳]
      description: >-
        埃斯文经过半个月到达艾斯文港，购置雪橇、皮靴、捕兽机、食品和狩猎证件，
        随马瑞万捕猎队溯江北上；到塔鲁夫镇后，他离队进入山本星荒野，在隐秘山谷藏好装备。
    伪装进入农场:
      start_time: [2, 1, 4]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 金利·艾, 普利芬国家第三志愿农场, 塔鲁夫镇, 奥格雷纳]
      description: >-
        第二年元月四日大雪降临，埃斯文伪造假释犯证件，冒充看守进入普利芬第三志愿农场，
        偷到一支枪并等待深夜行动。
    越狱救出金利艾:
      start_time: [2, 1, 4, 8]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 金利·艾, 普利芬国家第三志愿农场, 乌登纳斯瑞克山]
      description: >-
        黎明前，埃斯文击昏金利·艾，切断农场外层电网，谎称背运尸体，扛着金利·艾穿过大雪逃出农场。
        他将金利·艾装上雪橇，沿支流进入森林，抵达塔鲁夫上方的秘密谷地，搭帐篷、清理伤口并喂食。
    荒野苏醒与和解:
      start_time: [2, 1, 6]
      moais: [瑟尔瑞姆·哈尔斯·列米尔·埃斯文, 金利·艾, 乌登纳斯瑞克山, 奥格雷纳, 卡尔海德, 艾克曼]
      description: >-
        埃斯文发功后昏睡两昼夜，金利·艾在帐篷中苏醒。两人谈及农场药物、埃斯文过去对金利·艾使命的支持和误解，
        最终承认彼此信任并互相道歉；金利·艾答应教埃斯文心灵语言。

  逃亡大冰川:
    制定横越路线:
