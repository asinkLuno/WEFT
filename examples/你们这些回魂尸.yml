drift:
  身份环起点:
    婴儿被留在孤儿院:
      start_time: &orphanage_arrival [1945, 7, 20, 1, 0, 0]
      moais: [时环中的人, 婴儿珍妮, 酒吧老板, 克里夫兰孤儿院, 时间变换器]
      description: 酒吧老板把从1964年带走的婴儿留在1945年的孤儿院，闭合其成长起点。

  1963年相遇:
    青年抵达过去:
      start_time: &arrival_1963 [1963, 4, 3, 10, 30, 0]
      moais: [时环中的人, 未婚妈妈, 年轻男子, 酒吧老板, 克里夫兰之顶, 时间变换器]
      description: 酒吧老板把1970年的未婚妈妈带到1963年，使其以年轻男子身份寻找遗弃自己的人。
    自我相遇:
      # 文本确认相遇发生在1963年春季，以抵达当日作为这一阶段的排序锚点。
      start_time: [0, 0, 0, 1, 0, 0, *arrival_1963]
      moais: [时环中的人, 年轻珍妮, 年轻男子]
      description: 年轻男子结识年轻珍妮；双方尚不知道彼此是同一人的不同阶段，日期精度为阶段锚点。
    公园告别:
      start_time: &park_departure [1963, 4, 24, 22, 0, 0]
      moais: [时环中的人, 年轻珍妮, 年轻男子, 酒吧老板]
      description: 酒吧老板在两人告别后接走年轻男子，并揭示身份环的关键关系。

  1964年出生:
    珍妮分娩:
      # 文本未给出分娩的具体日期，只确认在婴儿被带走前，以3月初作为排序锚点。
      start_time: &birth_anchor [1964, 3, 1, 0, 0, 0]
      moais: [时环中的人, 年轻珍妮, 未婚妈妈, 婴儿珍妮]
      description: 年轻珍妮生下女婴；手术同时改变其此后的身体与社会身份，日期精度为月。
    婴儿被带走:
      start_time: &abduction [1964, 3, 10, 17, 0, 0]
      moais: [时环中的人, 婴儿珍妮, 未婚妈妈, 酒吧老板, 克里夫兰之顶, 时间变换器]
      description: 酒吧老板从医院带走婴儿，并准备将她送回1945年。
    送回1945年:
      start_time: [0, 0, 0, 1, 0, 0, *abduction]
      moais: [时环中的人, 婴儿珍妮, 酒吧老板, 克里夫兰孤儿院, 时间变换器]
      description: 以酒吧老板的个人经历顺序记录这次跳跃；目的时间是1945年7月20日。

  1970年招募:
    酒吧会面:
      start_time: &bar_meeting [1970, 11, 7, 22, 17, 0]
      moais: [时环中的人, 未婚妈妈, 酒吧老板, 老爹酒吧, 时空旅行局]
      description: 未婚妈妈向酒吧老板讲述身世，酒吧老板以找到遗弃者为条件提出招募。
    启动时间机器:
      start_time: &departure_1970 [1970, 11, 7, 23, 0, 0]
      moais: [时环中的人, 未婚妈妈, 酒吧老板, 老爹酒吧, 时间变换器]
      description: 两人从酒吧储藏室出发，前往1963年。
    返回酒吧:
      start_time: [1970, 11, 7, 23, 1, 0]
      moais: [时环中的人, 酒吧老板, 老爹酒吧, 时间变换器]
      description: 酒吧老板独自返回离开后一分钟的酒吧，维持其公开身份的连续性。

  局内生涯:
    青年加入时空局:
      start_time: &recruitment [1985, 8, 12, 23, 0, 0]
      moais: [时环中的人, 年轻男子, 酒吧老板, 时空旅行局, 洛基地下城, 时间变换器]
      description: 酒吧老板把年轻男子送到1985年的基地，安排其接受训练并成为未来的自己。
    老年返回总部:
      start_time: &return_1993 [1993, 1, 12, 22, 0, 0]
      moais: [时环中的人, 酒吧老板, 时空旅行局, 洛基地下城, 时间变换器]
      description: 完成招募行动后，酒吧老板返回1993年的总部。
    确认闭合身份:
      start_time: [0, 0, 0, 1, 0, 0, *return_1993]
      moais: [时环中的人, 婴儿珍妮, 年轻珍妮, 未婚妈妈, 年轻男子, 酒吧老板]
      description: 酒吧老板独处时确认所有关键身份、亲子关系与招募行动都属于同一个人。

