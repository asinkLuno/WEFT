story:
  title: 你们这些回魂尸
  description: >-
    以结构化事件摘要展示一个由同一人物的多重身份构成的闭合时间环。
    故事使用内置格里高利历，以酒吧老板的限知第一人称行动线串联
    1945、1963、1964、1970、1985与1993年的时间跳跃；不收录原文或对白。
  date_mode: gregorian

moai:
  时环中的人:
    description: >-
      同一生命在闭合因果环中的完整身份；既是自己的母亲与父亲，也是婴儿的绑架者、
      自己的招募者和晚年的酒吧老板。
  婴儿珍妮:
    description: 1964年出生后被带回1945年，并被留在克里夫兰孤儿院门口的婴儿身份。
  年轻珍妮:
    description: 在孤儿院长大、希望加入太空服务团，并于1963年遇见陌生男子的女性身份。
  未婚妈妈:
    description: 分娩手术后以男性身份生活、靠写忏悔故事谋生的青年作家。
  年轻男子:
    description: 从1970年被带回1963年后，与年轻珍妮相遇的男性身份。
  酒吧老板:
    description: 时空旅行局招募员；在1970年经营酒吧并执行构成自身因果环的任务。
  时空旅行局:
    description: 管理时间跳跃与招募行动的组织。
  老爹酒吧:
    description: 1970年纽约的酒吧，是招募行动开始和返回的地点。
  克里夫兰孤儿院:
    description: 婴儿珍妮于1945年被留下并长大的地点。
  克里夫兰之顶:
    description: 酒吧老板在1963与1964年执行多次时间跳跃的落脚点。
  洛基地下城:
    description: 时空旅行局在1985与1993年的基地。
  时间变换器:
    description: 时空旅行局使用的便携式时间跳跃设备。

